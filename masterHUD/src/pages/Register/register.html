<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <link rel="stylesheet" href="./register-style.css" />
</head>
<body>
  <main class="page">
    <section class="signup" aria-labelledby="signup-title">
      <h1 class="signup__title" id="signup-title">Create account</h1>

      <form class="signup__form" action="#" method="post">
        <div class="signup__fields">
          <label class="signup__field">
            <img class="signup__icon signup__icon--left" src="https://www.figma.com/api/mcp/asset/5db095a8-ffe4-4a00-b393-4fe88eec7bf2" alt="Email icon" />
            <input class="signup__input" type="email" name="email" placeholder="Email" autocomplete="email" />
          </label>

          <label class="signup__field">
            <img class="signup__icon signup__icon--left" src="https://www.figma.com/api/mcp/asset/694ef617-4eeb-4180-a7a7-b3acc92be540" alt="Password icon" />
            <input class="signup__input" type="password" name="password" placeholder="Password" autocomplete="new-password" />
            <img class="signup__icon signup__icon--right" src="https://www.figma.com/api/mcp/asset/1eceb801-6e40-4ee2-ae8e-124416cdac51" alt="Password hidden icon" />
          </label>

          <label class="signup__field">
            <img class="signup__icon signup__icon--left signup__icon--confirm-left" src="https://www.figma.com/api/mcp/asset/694ef617-4eeb-4180-a7a7-b3acc92be540" alt="Confirm password icon" />
            <input class="signup__input" type="password" name="confirm-password" placeholder="Confirm password" autocomplete="new-password" />
            <img class="signup__icon signup__icon--right signup__icon--confirm-right" src="https://www.figma.com/api/mcp/asset/16f90cd1-2b33-43a4-9beb-1df9104f753f" alt="Password visible icon" />
          </label>
        </div>

        <button class="signup__button" type="submit">Create</button>
      </form>

      <div class="signup__divider" aria-hidden="true"></div>

      <footer class="signup__footer">
        Have an account? <a class="signup__link" href="#">Login</a>
      </footer>
    </section>
  </main>

  <script>
    const signupForm = document.querySelector('.signup__form');

    signupForm.addEventListener('submit', function (event) {
      event.preventDefault();
    });
  </script>
</body>
</html>
